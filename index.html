<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Metro Weather</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    background: #ffffff;
    color: #333;

    touch-action: none;
}

#app {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
}


/* =========================================================
   SCREENS
========================================================= */

.screen {
    position: absolute;

    width: 100%;
    height: 100%;

    left: 0;
    top: 0;

    background: #fff;

    transition:
        transform .42s cubic-bezier(.25,.8,.25,1);
}

#home {
    transform: translateY(0);
}

#forecast {
    transform: translateY(100%);
}

.showForecast #home {
    transform: translateY(-100%);
}

.showForecast #forecast {
    transform: translateY(0);
}


/* =========================================================
   HOME SCREEN
========================================================= */

.location {
    position: absolute;

    top: 24px;
    left: 28px;

    font-size: 22px;
    font-weight: 300;

    letter-spacing: .1px;
}

.condition-top {
    position: absolute;

    top: 52px;
    left: 29px;

    font-size: 15px;
    font-weight: 300;

    color: #777;
}


/* =========================================================
   CURRENT WEATHER
========================================================= */

.current {
    position: absolute;

    left: 50%;
    top: 45%;

    transform: translate(-50%, -50%);

    width: 90%;

    text-align: center;
}

.weather-art {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -55%);

    width: 270px;
    height: 190px;

    opacity: .13;

    z-index: 0;

    pointer-events: none;
}


/* SUN */

.sun {
    position: absolute;

    width: 105px;
    height: 105px;

    border-radius: 50%;

    background: #f7b733;

    left: 82px;
    top: 20px;
}


/* MOON */

.moon {
    position: absolute;

    width: 105px;
    height: 105px;

    border-radius: 50%;

    background: #777;

    left: 82px;
    top: 20px;

    overflow: hidden;
}


/*
   Creates the crescent by placing
   a white circle over the moon.
*/

.moon:before {
    content: "";

    position: absolute;

    width: 105px;
    height: 105px;

    border-radius: 50%;

    background: #fff;

    left: 28px;
    top: -15px;
}


/* CLOUD */

.cloud {
    position: absolute;

    width: 170px;
    height: 75px;

    left: 45px;
    top: 95px;

    background: #777;

    border-radius: 50px;
}

.cloud:before {
    content: "";

    position: absolute;

    width: 75px;
    height: 75px;

    left: 35px;
    top: -38px;

    background: #777;

    border-radius: 50%;
}

.cloud:after {
    content: "";

    position: absolute;

    width: 62px;
    height: 62px;

    left: 90px;
    top: -26px;

    background: #777;

    border-radius: 50%;
}


/* RAIN */

.rain {
    position: absolute;

    width: 4px;
    height: 35px;

    background: #438ac4;

    transform: rotate(18deg);

    top: 165px;
}

.rain.one {
    left: 83px;
}

.rain.two {
    left: 125px;
}

.rain.three {
    left: 167px;
}


/* =========================================================
   TEMPERATURE
========================================================= */

.temperature {
    position: relative;

    z-index: 2;

    font-size: clamp(110px, 19vw, 175px);

    font-weight: 200;

    letter-spacing: -7px;

    line-height: .9;
}

.temperature-symbol {
    font-size: .48em;

    vertical-align: top;

    position: relative;
    top: 8px;

    letter-spacing: 0;
}

.condition {
    position: relative;

    z-index: 2;

    margin-top: 22px;

    font-size: 27px;

    font-weight: 300;
}

.high-low {
    position: relative;

    z-index: 2;

    margin-top: 7px;

    font-size: 17px;

    color: #777;

    font-weight: 300;
}


/* =========================================================
   HOME HOURLY STRIP
========================================================= */

.home-hours {
    position: absolute;

    left: 25px;
    right: 25px;
    bottom: 68px;

    height: 105px;

    overflow-x: auto;

    display: flex;

    scrollbar-width: none;

    border-top: 1px solid #e5e5e5;
}

.home-hours::-webkit-scrollbar {
    display: none;
}

.home-hour {
    min-width: 72px;

    text-align: center;

    padding-top: 12px;

    font-size: 13px;

    color: #555;
}

.home-hour-icon {
    font-size: 25px;

    margin: 7px 0;
}

.home-hour-temp {
    font-size: 18px;

    font-weight: 300;
}


/* =========================================================
   SWIPE MESSAGE
========================================================= */

.swipe-message {
    position: absolute;

    bottom: 17px;

    left: 0;
    width: 100%;

    text-align: center;

    font-size: 15px;

    color: #888;

    font-weight: 300;
}

.arrow {
    display: inline-block;

    margin-left: 5px;

    font-size: 20px;

    animation: arrowMove 1.8s infinite;
}

@keyframes arrowMove {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-4px);
    }

}


/* =========================================================
   FORECAST SCREEN
========================================================= */

.forecast-header {
    padding: 25px 28px 0;
}

.forecast-title {
    font-size: 30px;

    font-weight: 300;
}

.forecast-city {
    margin-top: 3px;

    font-size: 16px;

    color: #888;
}


/* 12 HOUR GRID */

.forecast-grid {
    position: absolute;

    top: 105px;
    left: 22px;
    right: 22px;
    bottom: 60px;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    grid-auto-rows: 1fr;

    gap: 1px;

    overflow: hidden;
}

.forecast-hour {
    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    border-bottom: 1px solid #eeeeee;

    background: #fff;
}

.forecast-time {
    font-size: 14px;

    color: #777;

    margin-bottom: 9px;
}

.forecast-icon {
    font-size: 32px;

    margin-bottom: 8px;
}

.forecast-temperature {
    font-size: 25px;

    font-weight: 300;
}


/* BACK */

.back-message {
    position: absolute;

    bottom: 17px;

    left: 0;
    width: 100%;

    text-align: center;

    font-size: 15px;

    color: #888;
}


/* =========================================================
   LOADING
========================================================= */

#loading {
    position: fixed;

    inset: 0;

    background: #fff;

    z-index: 100;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 18px;

    font-weight: 300;

    color: #777;
}


/* =========================================================
   ERROR
========================================================= */

#error {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 200;

    background: #fff;

    align-items: center;

    justify-content: center;

    text-align: center;

    font-weight: 300;
}

#error button {
    border: 1px solid #ccc;

    background: white;

    padding: 10px 22px;

    font-size: 16px;
}

</style>
</head>


<body>

<div id="app">


<!-- =====================================================
     HOME
===================================================== -->

<section class="screen" id="home">

    <div class="location" id="location">
        Finding location...
    </div>

    <div class="condition-top" id="topCondition">
        Loading…
    </div>


    <div class="current">

        <!-- WEATHER ART -->

        <div class="weather-art" id="weatherArt">
            <div class="sun"></div>
        </div>


        <!-- TEMPERATURE -->

        <div class="temperature">

            <span id="temperature">
                --
            </span>

            <span class="temperature-symbol">
                °
            </span>

        </div>


        <!-- CONDITION -->

        <div class="condition" id="condition">
            Loading…
        </div>


        <!-- HIGH / LOW -->

        <div class="high-low" id="highLow">
            --
        </div>

    </div>


    <!-- HOURLY STRIP -->

    <div class="home-hours" id="homeHours">
    </div>


    <!-- SWIPE -->

    <div class="swipe-message">

        Swipe up for hourly forecast

        <span class="arrow">↑</span>

    </div>

</section>



<!-- =====================================================
     12 HOUR FORECAST
===================================================== -->

<section class="screen" id="forecast">

    <div class="forecast-header">

        <div class="forecast-title">
            Hourly Forecast
        </div>

        <div class="forecast-city" id="forecastCity">
            Finding location...
        </div>

    </div>


    <div class="forecast-grid" id="forecastGrid">
    </div>


    <div class="back-message">
        Swipe down to return ↓
    </div>

</section>

</div>



<!-- LOADING -->

<div id="loading">
    Metro Weather is finding your location…
</div>


<!-- ERROR -->

<div id="error">

    <div>

        <h2>Weather unavailable</h2>

        <p>
            Metro Weather couldn't determine your location
            or connect to the weather service.
        </p>

        <button onclick="startMetroWeather()">
            Try Again
        </button>

    </div>

</div>



<script>

/* =========================================================
   METRO WEATHER
   DEVICE LOCATION
========================================================= */

let latitude = null;
let longitude = null;

let city = "";
let state = "";

let weatherData = null;


/* =========================================================
   WEATHER DESCRIPTION
========================================================= */

function weatherInfo(code) {

    if (code === 0)
        return ["sun", "Clear"];

    if (code === 1)
        return ["sun", "Mostly Clear"];

    if (code === 2)
        return ["partly", "Partly Cloudy"];

    if (code === 3)
        return ["cloud", "Cloudy"];

    if ([45, 48].includes(code))
        return ["cloud", "Foggy"];

    if ([51, 53, 55, 56, 57].includes(code))
        return ["rain", "Drizzle"];

    if ([61, 63, 65, 66, 67].includes(code))
        return ["rain", "Rain"];

    if ([71, 73, 75, 77, 85, 86].includes(code))
        return ["snow", "Snow"];

    if ([80, 81, 82].includes(code))
        return ["rain", "Rain Showers"];

    if ([95, 96, 99].includes(code))
        return ["storm", "Thunderstorm"];

    return ["cloud", "Cloudy"];
}


/* =========================================================
   NIGHT CHECK
   8:00 PM THROUGH 7:59 AM
========================================================= */

function isNight() {

    const hour =
        new Date().getHours();

    return hour >= 20 || hour < 8;

}


/* =========================================================
   WEATHER ART
========================================================= */

function createWeatherArt(type) {

    const art =
        document.getElementById("weatherArt");

    art.innerHTML = "";


    /* CLEAR */

    if (type === "sun") {

        if (isNight()) {

            art.innerHTML = `
                <div class="moon"></div>
            `;

        } else {

            art.innerHTML = `
                <div class="sun"></div>
            `;

        }

    }


    /* PARTLY CLOUDY */

    else if (type === "partly") {

        if (isNight()) {

            art.innerHTML = `
                <div class="moon"></div>
                <div class="cloud"></div>
            `;

        } else {

            art.innerHTML = `
                <div class="sun"></div>
                <div class="cloud"></div>
            `;

        }

    }


    /* CLOUDY */

    else if (type === "cloud") {

        art.innerHTML = `
            <div class="cloud"></div>
        `;

    }


    /* RAIN */

    else if (type === "rain") {

        art.innerHTML = `
            <div class="cloud"></div>

            <div class="rain one"></div>
            <div class="rain two"></div>
            <div class="rain three"></div>
        `;

    }


    /* SNOW */

    else if (type === "snow") {

        art.innerHTML = `
            <div class="cloud"></div>

            <div style="
                position:absolute;
                top:165px;
                left:90px;
                font-size:25px;
            ">•  •  •</div>
        `;

    }


    /* STORM */

    else if (type === "storm") {

        art.innerHTML = `
            <div class="cloud"></div>

            <div style="
                position:absolute;
                top:145px;
                left:118px;
                font-size:45px;
            ">⚡</div>
        `;

    }


    else {

        art.innerHTML = `
            <div class="cloud"></div>
        `;

    }

}


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(time, position) {

    if (position === 0)
        return "NOW";


    const date =
        new Date(time);


    return date.toLocaleTimeString(
        [],
        {
            hour: "numeric"
        }
    );

}


/* =========================================================
   FIND LOCATION FROM DEVICE
========================================================= */

async function getDeviceLocation() {

    if (!navigator.geolocation) {

        throw new Error(
            "Geolocation is not supported"
        );

    }


    const position =
        await new Promise(
            function(resolve, reject) {

                navigator.geolocation.getCurrentPosition(
                    resolve,
                    reject,
                    {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 0
                    }
                );

            }
        );


    latitude =
        position.coords.latitude;

    longitude =
        position.coords.longitude;


    const response =
        await fetch(
            "https://nominatim.openstreetmap.org/reverse" +
            "?format=jsonv2" +
            "&lat=" +
            encodeURIComponent(latitude) +
            "&lon=" +
            encodeURIComponent(longitude) +
            "&zoom=10" +
            "&addressdetails=1" +
            "&accept-language=en"
        );


    if (!response.ok) {

        throw new Error(
            "Location name request failed"
        );

    }


    const location =
        await response.json();


    const address =
        location.address || {};


    city =
        address.city ||
        address.town ||
        address.village ||
        address.hamlet ||
        address.municipality ||
        "Current Location";


    state =
        address.state || "";


    if (
        address["ISO3166-2-lvl4"] &&
        address["ISO3166-2-lvl4"].startsWith("US-")
    ) {

        state =
            address["ISO3166-2-lvl4"]
                .replace("US-", "");

    }


    const displayLocation =
        city +
        (state ? ", " + state : "");


    document.getElementById(
        "location"
    ).textContent =
        displayLocation;


    document.getElementById(
        "forecastCity"
    ).textContent =
        displayLocation;

}


/* =========================================================
   LOAD WEATHER
========================================================= */

async function loadWeather() {

    const url =
        "https://api.open-meteo.com/v1/forecast" +

        "?latitude=" +
        encodeURIComponent(latitude) +

        "&longitude=" +
        encodeURIComponent(longitude) +

        "&current=" +
        "temperature_2m," +
        "weather_code," +
        "is_day" +

        "&hourly=" +
        "temperature_2m," +
        "weather_code" +

        "&daily=" +
        "temperature_2m_max," +
        "temperature_2m_min" +

        "&temperature_unit=fahrenheit" +

        "&timezone=auto" +

        "&forecast_days=2";


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "Weather request failed"
        );

    }


    weatherData =
        await response.json();


    updateWeather();

}


/* =========================================================
   UPDATE CURRENT WEATHER
========================================================= */

function updateWeather() {

    const current =
        weatherData.current;


    const info =
        weatherInfo(
            current.weather_code
        );


    document.getElementById(
        "temperature"
    ).textContent =
        Math.round(
            current.temperature_2m
        );


    document.getElementById(
        "condition"
    ).textContent =
        info[1];


    document.getElementById(
        "topCondition"
    ).textContent =
        info[1];


    createWeatherArt(
        info[0]
    );


    const high =
        Math.round(
            weatherData.daily
                .temperature_2m_max[0]
        );


    const low =
        Math.round(
            weatherData.daily
                .temperature_2m_min[0]
        );


    document.getElementById(
        "highLow"
    ).textContent =
        "High " +
        high +
        "°   Low " +
        low +
        "°";


    createHourlyForecast();

}


/* =========================================================
   FIND CURRENT HOUR
========================================================= */

function findCurrentHour() {

    const now =
        new Date();


    const times =
        weatherData.hourly.time;


    for (
        let i = 0;
        i < times.length;
        i++
    ) {

        if (
            new Date(times[i]) >= now
        ) {

            return i;

        }

    }


    return 0;

}


/* =========================================================
   HOME + 12 HOUR FORECAST
========================================================= */

function createHourlyForecast() {

    const home =
        document.getElementById(
            "homeHours"
        );


    const grid =
        document.getElementById(
            "forecastGrid"
        );


    home.innerHTML = "";

    grid.innerHTML = "";


    const start =
        findCurrentHour();


    const times =
        weatherData.hourly.time;


    const temps =
        weatherData.hourly.temperature_2m;


    const codes =
        weatherData.hourly.weather_code;


    /* -----------------------------------------------------
       HOME: 6 HOURS
    ----------------------------------------------------- */

    for (
        let i = start;
        i < start + 6;
        i++
    ) {

        if (!times[i])
            break;


        const info =
            weatherInfo(
                codes[i]
            );


        const hour =
            document.createElement(
                "div"
            );


        hour.className =
            "home-hour";


        hour.innerHTML = `

            <div>
                ${formatTime(
                    times[i],
                    i - start
                )}
            </div>

            <div class="home-hour-icon">
                ${iconSymbol(info[0])}
            </div>

            <div class="home-hour-temp">
                ${Math.round(
                    temps[i]
                )}°
            </div>

        `;


        home.appendChild(hour);

    }


    /* -----------------------------------------------------
       FORECAST: 12 HOURS
    ----------------------------------------------------- */

    for (
        let i = start;
        i < start + 12;
        i++
    ) {

        if (!times[i])
            break;


        const info =
            weatherInfo(
                codes[i]
            );


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "forecast-hour";


        item.innerHTML = `

            <div class="forecast-time">

                ${formatTime(
                    times[i],
                    i - start
                )}

            </div>

            <div class="forecast-icon">

                ${iconSymbol(
                    info[0]
                )}

            </div>

            <div class="forecast-temperature">

                ${Math.round(
                    temps[i]
                )}°

            </div>

        `;


        grid.appendChild(item);

    }

}


/* =========================================================
   SMALL WEATHER SYMBOLS
========================================================= */

function iconSymbol(type) {

    if (type === "sun")
        return "☀";

    if (type === "partly")
        return "☼";

    if (type === "cloud")
        return "☁";

    if (type === "rain")
        return "☂";

    if (type === "snow")
        return "❄";

    if (type === "storm")
        return "⚡";

    return "☁";

}


/* =========================================================
   SWIPE
========================================================= */

let touchStartY = 0;


document.addEventListener(
    "touchstart",
    function(event) {

        touchStartY =
            event.touches[0].clientY;

    },
    { passive: true }
);


document.addEventListener(
    "touchend",
    function(event) {

        const touchEndY =
            event.changedTouches[0].clientY;


        const difference =
            touchStartY -
            touchEndY;


        if (difference > 65) {

            document
                .getElementById("app")
                .classList
                .add("showForecast");

        }


        if (difference < -65) {

            document
                .getElementById("app")
                .classList
                .remove("showForecast");

        }

    },
    { passive: true }
);


/* =========================================================
   START METRO WEATHER
========================================================= */

async function startMetroWeather() {

    document.getElementById(
        "loading"
    ).style.display = "flex";


    document.getElementById(
        "error"
    ).style.display = "none";


    document.getElementById(
        "location"
    ).textContent =
        "Finding location...";


    document.getElementById(
        "forecastCity"
    ).textContent =
        "Finding location...";


    try {

        await getDeviceLocation();

        await loadWeather();


        document.getElementById(
            "loading"
        ).style.display =
            "none";

    }

    catch (error) {

        console.error(
            "Metro Weather:",
            error
        );


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "error"
        ).style.display =
            "flex";

    }

}


/* =========================================================
   START
========================================================= */

startMetroWeather();


/* =========================================================
   REFRESH EVERY 15 MINUTES
========================================================= */

setInterval(
    startMetroWeather,
    15 * 60 * 1000
);

</script>

</body>
</html>
