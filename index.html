<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Metro Weather</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    color: #222;
    font-family: Arial, Helvetica, sans-serif;
}

.screen {
    position: absolute;
    inset: 0;
    background: white;
    transition: transform 0.35s ease;
}


/* =========================
   MAIN SCREEN
========================= */

#mainScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 35px;
}

#location {
    font-size: 18px;
    font-weight: 400;
}

#state {
    font-size: 14px;
    color: #777;
    margin-top: 2px;
}

#weatherArt {
    position: absolute;
    top: 105px;
    left: 50%;
    transform: translateX(-50%);

    font-size: 115px;

    opacity: 0.23;

    z-index: 0;

    pointer-events: none;
}

#temperature {
    position: relative;

    z-index: 1;

    margin-top: 55px;

    font-size: 110px;

    font-weight: 200;

    letter-spacing: -7px;

    line-height: 1;
}

#condition {
    position: relative;

    z-index: 2;

    margin-top: 8px;

    font-size: 20px;
}

#highLow {
    position: relative;

    z-index: 2;

    margin-top: 6px;

    font-size: 15px;

    color: #666;
}

#updated {
    position: absolute;

    bottom: 92px;

    font-size: 11px;

    color: #999;
}

#swipeText {
    position: absolute;

    bottom: 42px;

    width: 100%;

    text-align: center;

    font-size: 15px;

    color: #777;
}


/* =========================
   HOURLY SCREEN
========================= */

#hourlyScreen {
    transform: translateY(100%);

    overflow-y: auto;

    padding: 25px 15px 30px;
}

#hourlyTitle {
    text-align: center;

    font-size: 20px;

    margin-bottom: 20px;
}

#hourlyLocation {
    text-align: center;

    font-size: 14px;

    color: #777;

    margin-top: -12px;

    margin-bottom: 20px;
}

.hour {
    display: flex;

    align-items: center;

    height: 65px;

    border-bottom: 1px solid #eeeeee;
}

.hourTime {
    width: 65px;

    font-size: 14px;

    color: #555;
}

.hourIcon {
    width: 45px;

    font-size: 25px;

    text-align: center;
}

.hourTemp {
    flex: 1;

    text-align: right;

    font-size: 20px;
}

#backText {
    text-align: center;

    color: #888;

    font-size: 14px;

    padding-top: 20px;
}


/* =========================
   LOADING SCREEN
========================= */

#message {
    position: absolute;

    inset: 0;

    background: white;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 30px;

    z-index: 10;
}

#messageBox {
    max-width: 320px;
}

#messageTitle {
    font-size: 25px;

    margin-bottom: 12px;
}

#messageText {
    color: #666;

    line-height: 1.5;

    font-size: 15px;
}

#retry {
    margin-top: 20px;

    padding: 10px 22px;

    border: 1px solid #ccc;

    border-radius: 4px;

    background: white;

    font-size: 15px;
}

.hidden {
    display: none !important;
}

</style>
</head>


<body>


<!-- =========================
     MAIN WEATHER SCREEN
========================= -->

<div id="mainScreen" class="screen">

    <div id="location">
        Finding location...
    </div>

    <div id="state"></div>

    <div id="weatherArt">
        ☀️
    </div>

    <div id="temperature">
        --°
    </div>

    <div id="condition">
        Getting weather...
    </div>

    <div id="highLow">
        --° / --°
    </div>

    <div id="updated"></div>

    <div id="swipeText">
        Swipe up for hourly forecast ↑
    </div>

</div>


<!-- =========================
     HOURLY SCREEN
========================= -->

<div id="hourlyScreen" class="screen">

    <div id="hourlyTitle">
        Hourly Forecast
    </div>

    <div id="hourlyLocation">
        Finding location...
    </div>

    <div id="hours"></div>

    <div id="backText">
        Swipe down to return ↓
    </div>

</div>


<!-- =========================
     LOADING / ERROR
========================= -->

<div id="message">

    <div id="messageBox">

        <div id="messageTitle">
            Metro Weather
        </div>

        <div id="messageText">
            Finding your location...
        </div>

        <button id="retry" class="hidden">
            Try Again
        </button>

    </div>

</div>


<script>


/* =====================================================
   WEATHER CODES
===================================================== */

function weatherInfo(code) {

    if (code === 0)
        return ["Clear sky", "☀️"];

    if (code === 1)
        return ["Mostly clear", "🌤️"];

    if (code === 2)
        return ["Partly cloudy", "⛅"];

    if (code === 3)
        return ["Cloudy", "☁️"];

    if ([45, 48].includes(code))
        return ["Foggy", "🌫️"];

    if ([51, 53, 55].includes(code))
        return ["Drizzle", "🌦️"];

    if ([61, 63, 65].includes(code))
        return ["Rain", "🌧️"];

    if ([66, 67].includes(code))
        return ["Freezing rain", "🌧️"];

    if ([71, 73, 75, 77].includes(code))
        return ["Snow", "🌨️"];

    if ([80, 81, 82].includes(code))
        return ["Rain showers", "🌦️"];

    if ([85, 86].includes(code))
        return ["Snow showers", "🌨️"];

    if ([95, 96, 99].includes(code))
        return ["Thunderstorm", "⛈️"];

    return ["Weather", "🌤️"];
}



/* =====================================================
   GET LOCATION FROM IP
===================================================== */

async function getIPLocation() {

    try {

        const response =
            await fetch(
                "https://ipapi.co/json/",
                {
                    cache: "no-store"
                }
            );

        if (!response.ok)
            throw new Error("IP location failed");

        const location =
            await response.json();


        if (
            !location.latitude ||
            !location.longitude
        ) {
            throw new Error("No coordinates");
        }


        /* Show location */

        document.getElementById(
            "location"
        ).textContent =
            location.city ||
            "Current Location";


        document.getElementById(
            "state"
        ).textContent =
            location.region ||
            "";


        document.getElementById(
            "hourlyLocation"
        ).textContent =
            (location.city || "Current Location") +
            (
                location.region
                ? ", " + location.region
                : ""
            );


        /* Load weather */

        await loadWeather(
            location.latitude,
            location.longitude
        );


    } catch (error) {

        showError(
            "Location unavailable",
            "Metro Weather couldn't determine your location from your internet connection."
        );

    }

}



/* =====================================================
   LOAD WEATHER
===================================================== */

async function loadWeather(
    latitude,
    longitude
) {

    try {

        const url =
            "https://api.open-meteo.com/v1/forecast" +

            "?latitude=" +
            encodeURIComponent(latitude) +

            "&longitude=" +
            encodeURIComponent(longitude) +

            "&current=" +
            "temperature_2m," +
            "weather_code" +

            "&hourly=" +
            "temperature_2m," +
            "weather_code" +

            "&daily=" +
            "temperature_2m_max," +
            "temperature_2m_min" +

            "&temperature_unit=fahrenheit" +

            "&timezone=auto" +

            "&forecast_days=2";


        const response =
            await fetch(url);


        if (!response.ok)
            throw new Error(
                "Weather request failed"
            );


        const data =
            await response.json();


        updateWeather(data);

    }

    catch (error) {

        showError(
            "Weather unavailable",
            "Metro Weather couldn't connect to the weather service."
        );

    }

}



/* =====================================================
   UPDATE MAIN WEATHER
===================================================== */

function updateWeather(data) {

    const current =
        data.current;

    const daily =
        data.daily;


    const info =
        weatherInfo(
            current.weather_code
        );


    document.getElementById(
        "temperature"
    ).textContent =
        Math.round(
            current.temperature_2m
        ) + "°";


    document.getElementById(
        "condition"
    ).textContent =
        info[0];


    document.getElementById(
        "weatherArt"
    ).textContent =
        info[1];


    document.getElementById(
        "highLow"
    ).textContent =

        Math.round(
            daily.temperature_2m_max[0]
        ) +

        "° / " +

        Math.round(
            daily.temperature_2m_min[0]
        ) +

        "°";


    document.getElementById(
        "updated"
    ).textContent =
        "Updated just now";


    buildHourly(data);


    /* Remove loading screen */

    document.getElementById(
        "message"
    ).classList.add("hidden");

}



/* =====================================================
   BUILD 12-HOUR FORECAST
===================================================== */

function buildHourly(data) {

    const container =
        document.getElementById(
            "hours"
        );


    container.innerHTML = "";


    const times =
        data.hourly.time;

    const temperatures =
        data.hourly.temperature_2m;

    const codes =
        data.hourly.weather_code;


    const now =
        new Date();


    let shown = 0;


    for (
        let i = 0;
        i < times.length;
        i++
    ) {

        const time =
            new Date(times[i]);


        if (time < now)
            continue;


        if (shown >= 12)
            break;


        const info =
            weatherInfo(
                codes[i]
            );


        const row =
            document.createElement(
                "div"
            );


        row.className =
            "hour";


        let hourText =
            time.toLocaleTimeString(
                [],
                {
                    hour: "numeric"
                }
            );


        row.innerHTML =

            '<div class="hourTime">' +
                hourText +
            '</div>' +

            '<div class="hourIcon">' +
                info[1] +
            '</div>' +

            '<div class="hourTemp">' +
                Math.round(
                    temperatures[i]
                ) +
                '°' +
            '</div>';


        container.appendChild(row);


        shown++;

    }

}



/* =====================================================
   ERROR
===================================================== */

function showError(
    title,
    text
) {

    document.getElementById(
        "messageTitle"
    ).textContent =
        title;


    document.getElementById(
        "messageText"
    ).textContent =
        text;


    document.getElementById(
        "retry"
    ).classList.remove(
        "hidden"
    );

}



/* =====================================================
   RETRY
===================================================== */

document.getElementById(
    "retry"
).onclick = function() {

    document.getElementById(
        "retry"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "messageTitle"
    ).textContent =
        "Metro Weather";


    document.getElementById(
        "messageText"
    ).textContent =
        "Finding your location...";


    getIPLocation();

};



/* =====================================================
   SWIPE CONTROLS
===================================================== */

let startY = 0;


document.addEventListener(
    "touchstart",
    function(event) {

        startY =
            event.touches[0].clientY;

    }
);


document.addEventListener(
    "touchend",
    function(event) {

        const endY =
            event.changedTouches[0].clientY;


        const difference =
            startY - endY;


        /* Swipe UP */

        if (difference > 60) {

            document.getElementById(
                "mainScreen"
            ).style.transform =
                "translateY(-100%)";


            document.getElementById(
                "hourlyScreen"
            ).style.transform =
                "translateY(0)";

        }


        /* Swipe DOWN */

        if (difference < -60) {

            document.getElementById(
                "mainScreen"
            ).style.transform =
                "translateY(0)";


            document.getElementById(
                "hourlyScreen"
            ).style.transform =
                "translateY(100%)";

        }

    }
);



/* =====================================================
   START METRO WEATHER
===================================================== */

getIPLocation();



/* =====================================================
   REFRESH EVERY 15 MINUTES
===================================================== */

setInterval(
    function() {

        getIPLocation();

    },
    15 * 60 * 1000
);

</script>

</body>
</html>
